name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Build on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.2"
          usesh: true
          prepare: |
            pkg install -y curl
          run: |
            set -e
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            . "$HOME/.cargo/env"
            cargo build --release
            strip target/release/dail
            cp target/release/dail dail-freebsd-amd64

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" > /dev/null 2>&1; then
            echo "Release already exists. Uploading assets to existing release."
            gh release upload "${{ github.ref_name }}" \
              dail-freebsd-amd64 --clobber
          else
            gh release create "${{ github.ref_name }}" \
              --title "dail ${{ github.ref_name }}" \
              --generate-notes \
              dail-freebsd-amd64
          fi
